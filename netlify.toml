# Configuración de despliegue en Netlify para Next.js (App Router).
# El plugin oficial convierte route handlers y SSR en Netlify Functions.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Las variables de entorno (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
# ANTHROPIC_API_KEY, NEXT_PUBLIC_SITE_URL) se configuran en:
# Netlify → Site settings → Environment variables. No se guardan en este archivo.

# Limpieza diaria de posts de Competencia con más de 40 días de publicados
# (netlify/functions/cleanup-competencia-scheduled.ts). Requiere
# SUPABASE_SERVICE_ROLE_KEY seteada en Netlify (ya lo está, la usa también
# el ingest de Recursos).
[functions."cleanup-competencia-scheduled"]
  schedule = "@daily"

# Renovación diaria de los tokens de Instagram que vencen dentro de 7 días
# (netlify/functions/refresh-instagram-tokens-scheduled.ts). El long-lived token
# dura ~60 días: sin esto, si nadie aprieta "Renovar token" en el perfil del
# cliente, la cuenta deja de traer métricas. Requiere SUPABASE_SERVICE_ROLE_KEY.
[functions."refresh-instagram-tokens-scheduled"]
  schedule = "@daily"
